<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field notes — hard-mode second app</title>
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/variant.css">
</head>
<body>
  <header class="notebook-bar">
    <h1 class="notebook-title">Field notes</h1>
    <div class="notebook-actions" id="actions"></div>
  </header>
  <table class="notes-table">
    <thead>
      <tr><th scope="col">Note</th><th scope="col">Tag</th></tr>
    </thead>
    <tbody class="notes-body"></tbody>
  </table>
  <p class="empty-note" hidden>No notes in this notebook yet.</p>
  <script src="/variant.js"></script>
</body>
</html>
